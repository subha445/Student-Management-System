<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="script.js?v=2" defer></script>
</head>

<body>

<!-- ADMIN LOGIN -->
<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <div class="login-icon">🔐</div>

        <h1>StudentHub</h1>

        <p>Admin Login</p>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="loginAdmin()">
            Login
        </button>

        <small id="loginError"></small>

    </div>

</div>


<div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>🎓 Student<span>Hub</span></h2>

        <nav>
            <a href="#dashboard">📊 Dashboard</a>
            <a href="#students">👨‍🎓 Students</a>
            <a href="#addStudent">➕ Add Student</a>
        </nav>

        <button id="themeBtn" onclick="toggleTheme()">
            🌙 Dark Mode
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- HEADER -->
        <header>

            <div>
                <h1>Student Management System</h1>
                <p>Manage your students easily 🚀</p>
            </div>

            <div class="profile">
                👤 Admin
            </div>

        </header>


        <!-- DASHBOARD -->
        <section id="dashboard">

            <div class="cards">

                <div class="card">

                    <div>
                        <p>Total Students</p>
                        <h2 id="totalStudents">0</h2>
                    </div>

                    <span>👨‍🎓</span>

                </div>


                <div class="card">

                    <div>
                        <p>Average Marks</p>
                        <h2 id="averageMarks">0</h2>
                    </div>

                    <span>📈</span>

                </div>


                <div class="card">

                    <div>
                        <p>Highest Mark</p>
                        <h2 id="highestMark">0</h2>
                    </div>

                    <span>🏆</span>

                </div>
